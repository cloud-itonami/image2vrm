<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>image2vrm — Photo → VTuber 3D Avatar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;background:#0a0a0f;color:#fff}
.app{display:flex;flex-direction:column;height:100%}
.header{padding:12px 20px;background:rgba(20,18,30,0.95);border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:12px;z-index:10}
.header h1{font-size:18px;font-weight:700;color:#e8e4f0}
.header .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(120,100,255,0.2);color:#a090ff}
.header .pipeline{font-size:11px;color:#666;margin-left:auto;font-family:monospace}
.main{flex:1;display:flex;position:relative}
.viewer{flex:1;position:relative;background:#0d0c14}
canvas{width:100%;height:100%;display:block}
.sidebar{width:320px;background:rgba(16,14,24,0.98);border-left:1px solid rgba(255,255,255,0.06);overflow-y:auto;padding:16px}
.section{margin-bottom:20px}
.section h3{font-size:13px;font-weight:600;color:#a090cc;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:border-color 0.2s}
.grid img:hover{border-color:rgba(120,100,255,0.5)}
.grid img.active{border-color:#7060ff;box-shadow:0 0 8px rgba(120,100,255,0.3)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(255,255,255,0.03);border-radius:8px;padding:10px}
.stat .label{font-size:10px;color:#666;text-transform:uppercase}
.stat .value{font-size:16px;font-weight:700;color:#e0dcf0;margin-top:2px}
.analysis{font-size:12px;line-height:1.6}
.analysis .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.analysis .key{color:#888}
.analysis .val{color:#d0ccf0;font-weight:500}
.color-swatch{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px;border:1px solid rgba(255,255,255,0.1)}
.controls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.controls button{padding:8px 16px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;background:rgba(20,18,30,0.9);color:#ccc;font-size:12px;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(8px)}
.controls button:hover{background:rgba(120,100,255,0.2);border-color:rgba(120,100,255,0.4);color:#fff}
.controls button.active{background:rgba(120,100,255,0.3);border-color:#7060ff;color:#fff}
.status{position:absolute;top:12px;left:12px;font-size:11px;color:#555;z-index:5;font-family:monospace}
.loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:5}
.loader .spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#7060ff;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>image2vrm</h1>
    <span class="badge">Design C Hybrid</span>
    <span class="pipeline" id="pipelineId">avt-mnftierd-jxre71</span>
  </div>
  <div class="main">
    <div class="viewer">
      <canvas id="canvas3d"></canvas>
      <div class="status" id="status">Initializing WebGPU...</div>
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <div style="font-size:13px;color:#888">Loading 3DGS avatar...</div>
      </div>
      <div class="controls">
        <button id="btnReset" title="Reset camera">Reset</button>
        <button id="btnAuto" class="active" title="Auto rotate">Auto Rotate</button>
        <button id="btnExpr" title="Cycle expressions">Expression</button>
      </div>
    </div>
    <div class="sidebar">
      <div class="section">
        <h3>Turnaround Views</h3>
        <div class="grid" id="viewGrid"></div>
      </div>
      <div class="section">
        <h3>3DGS Stats</h3>
        <div class="stats">
          <div class="stat"><div class="label">Gaussians</div><div class="value" id="numSplats">—</div></div>
          <div class="stat"><div class="label">File Size</div><div class="value" id="fileSize">—</div></div>
          <div class="stat"><div class="label">FPS</div><div class="value" id="fps">—</div></div>
          <div class="stat"><div class="label">Mode</div><div class="value">Hybrid</div></div>
        </div>
      </div>
      <div class="section">
        <h3>Face Analysis</h3>
        <div class="analysis" id="analysis"></div>
      </div>
      <div class="section">
        <h3>Expression Regions</h3>
        <div class="analysis" id="regions"></div>
      </div>
    </div>
  </div>
</div>
<script>
const PIPELINE = "avt-mnftierd-jxre71";
const R2_BASE = "https://murakumo.etzhayyim.com";
const CDN_BASE = R2_BASE;
const VIEWS = [
  {angle: "0°", file: "view_0_front.png", label: "Front"},
  {angle: "45°", file: "view_1_45r.png", label: "45° R"},
  {angle: "90°", file: "view_2_90r.png", label: "Profile R"},
  {angle: "135°", file: "view_3_135r.png", label: "135° R"},
  {angle: "180°", file: "view_4_180.png", label: "Back"},
  {angle: "225°", file: "view_5_225l.png", label: "225° L"},
  {angle: "270°", file: "view_6_270l.png", label: "Profile L"},
  {angle: "315°", file: "view_7_315l.png", label: "315° L"},
];
const FACE = {
  skinTone: [0.083, 0.20, 0.94],
  eyeColor: [0.569, 0.55, 0.70],
  hairColor: [0.125, 0.35, 0.88],
  hairStyle: "long straight",
  faceShape: "oval",
  ageRange: "18-23",
  gender: "feminine",
};
const REGIONS = ["left_eye","right_eye","left_brow","right_brow","nose","mouth","jaw","left_cheek","right_cheek","forehead","chin"];

// Populate sidebar
const grid = document.getElementById("viewGrid");
VIEWS.forEach((v, i) => {
  const img = document.createElement("img");
  // Use R2 proxy URL through Murakumo worker
  img.src = `/api/r2/avatar/${PIPELINE}/${v.file}`;
  img.alt = v.label;
  img.title = `${v.label} (${v.angle})`;
  img.onerror = () => { img.style.opacity = "0.3"; };
  if (i === 0) img.classList.add("active");
  img.onclick = () => {
    grid.querySelectorAll("img").forEach(x => x.classList.remove("active"));
    img.classList.add("active");
  };
  grid.appendChild(img);
});

function hslToRgb(h, s, l) {
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h * 12) % 12; return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1); };
  return [Math.round(f(0)*255), Math.round(f(8)*255), Math.round(f(4)*255)];
}

const analysis = document.getElementById("analysis");
const skinRgb = hslToRgb(...FACE.skinTone);
const eyeRgb = hslToRgb(...FACE.eyeColor);
const hairRgb = hslToRgb(...FACE.hairColor);
analysis.innerHTML = [
  ["Skin", `<span class="color-swatch" style="background:rgb(${skinRgb})"></span>HSL(${(FACE.skinTone[0]*360).toFixed(0)}°, ${(FACE.skinTone[1]*100).toFixed(0)}%, ${(FACE.skinTone[2]*100).toFixed(0)}%)`],
  ["Eyes", `<span class="color-swatch" style="background:rgb(${eyeRgb})"></span>HSL(${(FACE.eyeColor[0]*360).toFixed(0)}°, ${(FACE.eyeColor[1]*100).toFixed(0)}%, ${(FACE.eyeColor[2]*100).toFixed(0)}%)`],
  ["Hair", `<span class="color-swatch" style="background:rgb(${hairRgb})"></span>${FACE.hairStyle}`],
  ["Face", FACE.faceShape],
  ["Age", FACE.ageRange],
  ["Presentation", FACE.gender],
].map(([k,v]) => `<div class="row"><span class="key">${k}</span><span class="val">${v}</span></div>`).join("");

const regions = document.getElementById("regions");
regions.innerHTML = REGIONS.map(r => `<div class="row"><span class="key">${r.replace("_"," ")}</span><span class="val">active</span></div>`).join("");

// === WebGPU 3DGS Renderer ===
const canvas = document.getElementById("canvas3d");
const status = document.getElementById("status");
const loader = document.getElementById("loader");
let autoRotate = true;
let angle = 0;
let splats = null;
let frameCount = 0;
let lastFpsTime = performance.now();

document.getElementById("btnAuto").onclick = (e) => {
  autoRotate = !autoRotate;
  e.target.classList.toggle("active", autoRotate);
};
document.getElementById("btnReset").onclick = () => { angle = 0; };

async function loadSplat(url) {
  status.textContent = "Fetching face.splat...";
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const buf = await resp.arrayBuffer();
    const count = buf.byteLength / 32;
    document.getElementById("numSplats").textContent = count.toLocaleString();
    document.getElementById("fileSize").textContent = (buf.byteLength / 1024 / 1024).toFixed(1) + " MB";
    status.textContent = `Loaded ${count.toLocaleString()} splats`;
    loader.style.display = "none";
    return { buffer: buf, count };
  } catch (e) {
    status.textContent = `Load error: ${e.message}`;
    loader.querySelector("div:last-child").textContent = "Using fallback renderer";
    loader.querySelector(".spinner").style.display = "none";
    return null;
  }
}

// Canvas 2D fallback renderer (when WebGPU unavailable or splat loading)
function renderFallback(ctx, w, h, splatData, t) {
  ctx.fillStyle = "#0d0c14";
  ctx.fillRect(0, 0, w, h);

  if (!splatData) {
    ctx.fillStyle = "#333";
    ctx.font = "14px monospace";
    ctx.textAlign = "center";
    ctx.fillText("Loading 3DGS data...", w/2, h/2);
    return;
  }

  const { buffer, count } = splatData;
  const view = new DataView(buffer);
  const cx = w / 2, cy = h / 2;
  const camDist = 2.5;
  const fov = 500;

  // Camera orbit
  const camAngle = t;
  const camX = Math.sin(camAngle) * camDist;
  const camZ = Math.cos(camAngle) * camDist;

  // Sort by distance (simple, every frame)
  const indices = [];
  for (let i = 0; i < Math.min(count, 30000); i++) {
    const off = i * 32;
    const x = view.getFloat32(off, true);
    const y = view.getFloat32(off + 4, true);
    const z = view.getFloat32(off + 8, true);
    const dx = x - camX, dz = z - camZ;
    indices.push({ i, dist: dx*dx + dz*dz + y*y });
  }
  indices.sort((a, b) => b.dist - a.dist);

  // Render splats as circles
  for (const { i } of indices) {
    const off = i * 32;
    const x = view.getFloat32(off, true);
    const y = view.getFloat32(off + 4, true);
    const z = view.getFloat32(off + 8, true);

    // Rotate point by camera
    const rx = x * Math.cos(camAngle) + z * Math.sin(camAngle) - 0;
    const rz = -x * Math.sin(camAngle) + z * Math.cos(camAngle) - camDist;
    const ry = -y;

    if (rz >= -0.1) continue;
    const depth = -rz;

    const sx = cx + (rx / depth) * fov;
    const sy = cy + (ry / depth) * fov;

    const scale0 = view.getFloat32(off + 12, true);
    const scale1 = view.getFloat32(off + 16, true);
    const radius = Math.max(1, Math.min(20, (scale0 + scale1) * 0.5 * fov / depth * 3));

    const r = view.getUint8(off + 24);
    const g = view.getUint8(off + 25);
    const b = view.getUint8(off + 26);
    const a = view.getUint8(off + 27) / 255;

    if (a < 0.05) continue;
    ctx.globalAlpha = Math.min(1, a * 1.5);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.beginPath();
    ctx.arc(sx, sy, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

async function main() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;

  // Try loading splat
  const splatUrl = `/api/r2/avatar/${PIPELINE}/face.splat`;
  splats = await loadSplat(splatUrl);

  // Use Canvas 2D for rendering (WebGPU would use kami-web WASM)
  const ctx = canvas.getContext("2d");
  if (!ctx) { status.textContent = "Canvas not available"; return; }

  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;

  function frame() {
    if (autoRotate) angle += 0.008;

    renderFallback(ctx, canvas.width, canvas.height, splats, angle);

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime > 1000) {
      document.getElementById("fps").textContent = frameCount;
      frameCount = 0;
      lastFpsTime = now;
    }
    requestAnimationFrame(frame);
  }
  frame();

  // Mouse drag rotation
  let dragging = false, lastX = 0;
  canvas.onmousedown = (e) => { dragging = true; lastX = e.clientX; autoRotate = false; document.getElementById("btnAuto").classList.remove("active"); };
  canvas.onmousemove = (e) => { if (dragging) { angle += (e.clientX - lastX) * 0.005; lastX = e.clientX; } };
  canvas.onmouseup = () => { dragging = false; };
  canvas.onwheel = (e) => { e.preventDefault(); };

  window.onresize = () => { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; };
}

main();
</script>
</body>
</html>
